            <input type="text" id="tipo" required><br><br>

            <label for="servico">Serviço Desejado:</label><br>
            <input type="text" id="servico" required><br><br>

            <label for="observacao">Observação:</label><br>
            <input type="text" id="observacao"><br><br>



            <button type="submit" onclick="add()">Enviar</button>
